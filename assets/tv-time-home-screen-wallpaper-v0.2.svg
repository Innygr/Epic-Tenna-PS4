<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#180609"/><stop offset=".55" stop-color="#5b080e"/><stop offset="1" stop-color="#170707"/>
    </linearGradient>
    <radialGradient id="halo"><stop stop-color="#ed1c24" stop-opacity=".55"/><stop offset="1" stop-color="#ed1c24" stop-opacity="0"/></radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3b090d"/><stop offset=".55" stop-color="#13080a"/><stop offset="1" stop-color="#4b2608"/>
    </linearGradient>
    <linearGradient id="gold"><stop stop-color="#fff29a"/><stop offset=".5" stop-color="#ffd400"/><stop offset="1" stop-color="#ff9f00"/></linearGradient>
    <pattern id="scan" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 0H7" stroke="#fff1b0" stroke-opacity=".12" stroke-width="2"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1400" cy="470" r="600" fill="url(#halo)"/>
  <path d="M0 850 C300 760 510 780 760 900 S1250 1030 1920 760V1080H0Z" fill="#090607" opacity=".75"/>
  <g opacity=".24" stroke="#ffd400" fill="none"><path d="M0 160H1920M0 930H1920" stroke-dasharray="4 18"/><path d="M130 0V1080M1790 0V1080" stroke-dasharray="4 20"/></g>
  <!-- broadcast title area; kept left-weighted for PS4 menu readability -->
  <g font-family="Arial,sans-serif">
    <text x="115" y="230" fill="#ffd400" font-size="30" font-weight="700" letter-spacing="12">TENNA BROADCAST NETWORK</text>
    <path d="M115 260H690" stroke="#ed1c24" stroke-width="8"/>
    <text x="105" y="410" fill="#fff8e5" font-size="112" font-weight="900" letter-spacing="2">TV TIME</text>
    <text x="115" y="475" fill="url(#gold)" font-size="28" font-weight="700" letter-spacing="9">YOU'RE WATCHING THE SHOW!</text>
    <g transform="translate(120 555)">
      <rect width="190" height="48" rx="7" fill="#ed1c24"/>
      <circle cx="25" cy="24" r="7" fill="#fff8e5"/>
      <text x="48" y="32" fill="#fff8e5" font-size="20" font-weight="700" letter-spacing="4">ON AIR</text>
    </g>
    <text x="115" y="980" fill="#f7dca1" opacity=".7" font-size="18" font-weight="700" letter-spacing="5">A DELTARUNE FAN THEME • CH 014.02</text>
  </g>
  <!-- original TV-showman mascot silhouette, inspired by the broadcast-host theme -->
  <g transform="translate(1335 545)">
    <ellipse cx="20" cy="390" rx="390" ry="45" fill="#000" opacity=".48" filter="url(#glow)"/>
    <!-- antenna -->
    <path d="M-35 -330L-145 -465M-35 -330L85 -485" stroke="#ffd400" stroke-width="17" stroke-linecap="round"/>
    <circle cx="-150" cy="-470" r="19" fill="#ed1c24" stroke="#ffd400" stroke-width="7"/>
    <circle cx="90" cy="-490" r="19" fill="#ed1c24" stroke="#ffd400" stroke-width="7"/>
    <!-- head casing -->
    <rect x="-300" y="-365" width="600" height="485" rx="76" fill="#090607" stroke="#ed1c24" stroke-width="24"/>
    <rect x="-275" y="-340" width="550" height="435" rx="58" fill="url(#screen)" stroke="#ffd400" stroke-width="11"/>
    <rect x="-275" y="-340" width="550" height="435" rx="58" fill="url(#scan)"/>
    <!-- stylized expressive face -->
    <path d="M-160 -165Q-105 -220 -45 -165M55 -165Q115 -220 165 -165" fill="none" stroke="#ffd400" stroke-width="22" stroke-linecap="round"/>
    <path d="M-145 -90Q0 35 150 -90" fill="none" stroke="#fff2a0" stroke-width="24" stroke-linecap="round"/>
    <path d="M-145 -90Q0 65 150 -90" fill="none" stroke="#ed1c24" stroke-width="8" stroke-linecap="round"/>
    <!-- side dials -->
    <circle cx="-315" cy="-120" r="25" fill="#ffd400" stroke="#090607" stroke-width="8"/>
    <circle cx="315" cy="-120" r="25" fill="#ffd400" stroke="#090607" stroke-width="8"/>
    <!-- neck and showman suit -->
    <path d="M-105 115V190H105V115" fill="#1b0a0b" stroke="#ffd400" stroke-width="12"/>
    <path d="M-265 195L-150 155L0 250L150 155L265 195L350 510H-350Z" fill="#171012" stroke="#ed1c24" stroke-width="18" stroke-linejoin="round"/>
    <path d="M-150 160L0 250L-95 510H-250L-265 195Z" fill="#fff0bd"/>
    <path d="M150 160L0 250L95 510H250L265 195Z" fill="#fff0bd"/>
    <path d="M-65 230L0 285L65 230L38 355H-38Z" fill="#ed1c24" stroke="#ffd400" stroke-width="8"/>
    <path d="M-350 510H350" stroke="#ffd400" stroke-width="16"/>
    <!-- little broadcast badge -->
    <rect x="175" y="365" width="105" height="65" rx="8" fill="#ed1c24" stroke="#ffd400" stroke-width="6"/>
    <text x="227" y="408" fill="#fff8e5" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="900">TV</text>
  </g>
  <g fill="#ffd400" opacity=".7"><circle cx="1050" cy="180" r="5"/><circle cx="1690" cy="190" r="4"/><circle cx="1010" cy="850" r="3"/><circle cx="1790" cy="830" r="5"/></g>
</svg>