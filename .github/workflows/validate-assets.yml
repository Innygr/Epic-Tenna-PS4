name: Validate TV TIME asset staging

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Cairo runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcairo2
      - name: Install asset dependencies
        run: python -m pip install -r requirements-packaging.txt
      - name: Render staging assets
        run: python tools/prepare_assets.py --output "$RUNNER_TEMP/tv-time/Image0"
      - name: Build experimental dynamic scene candidate
        run: python tools/build_dynamic_scene.py --output "$RUNNER_TEMP/tv-time-dynamic"
      - name: Validate dynamic scene frame budget
        run: |
          python -c 'from pathlib import Path; import sys, xml.etree.ElementTree as ET; p=Path(sys.argv[1]); f=sorted(p.glob("*.dds")); assert len(f)==12; assert all(x.stat().st_size==128+640*360//2 for x in f); assert sum(x.stat().st_size for x in f)<6*1024*1024; r=ET.parse(p/"index.xml").getroot(); assert len(r.findall("material"))==12; assert len(r.findall("actor"))==12; assert len(r.find("sequence").findall("case"))==12; print("PASS:",len(f),"DXT1 frames,",sum(x.stat().st_size for x in f),"bytes")' "$RUNNER_TEMP/tv-time-dynamic/scene/background.raf"
      - name: Check optional AT9 conversion helper syntax
        run: python -m py_compile tools/convert_home_bgm.py
      - name: Test AT9 conversion wrapper with a local stub encoder
        run: python -m unittest discover -s tests -v
      - name: Generate original TV TIME home music
        run: python tools/generate_home_bgm.py --output "$RUNNER_TEMP/tv-time/sound/bgm_home.wav"
      - name: Analyze home music source master
        run: python tools/analyze_home_bgm.py "$RUNNER_TEMP/tv-time/sound/bgm_home.wav" --output "$RUNNER_TEMP/tv-time/sound/bgm_home-analysis.json"
      - name: Validate images and manifest
        run: python tools/validate_staging.py --staging "$RUNNER_TEMP/tv-time/Image0"
      - name: Generate and validate package SFO XML input
        run: python tools/build_param_sfx.py --title-id CUSA00000 --date 20261121 --output "$RUNNER_TEMP/tv-time/package-input/param-ci-fixture.sfx"
      - name: Build binary param.sfo from CI fixture
        run: python tools/build_param_sfo.py --input "$RUNNER_TEMP/tv-time/package-input/param-ci-fixture.sfx" --output "$RUNNER_TEMP/tv-time/package-input/param-ci-fixture.sfo"
      - name: Prepare theme staging with binary SFO fixture
        run: python tools/prepare_assets.py --output "$RUNNER_TEMP/tv-time/Image0-with-sfo/Image0" --param-sfo "$RUNNER_TEMP/tv-time/package-input/param-ci-fixture.sfo"
      - name: Validate theme staging with binary SFO fixture
        run: python tools/validate_staging.py --staging "$RUNNER_TEMP/tv-time/Image0-with-sfo/Image0"
      - name: Generate and validate theme GP4 project fixture
        run: python tools/build_gp4.py --staging "$RUNNER_TEMP/tv-time/Image0-with-sfo/Image0" --output "$RUNNER_TEMP/tv-time/package-input/tv-time-ci-fixture.gp4" --timestamp "2026-11-21 00:00:00"
      - name: Audit CI fixture package inputs
        run: python tools/audit_package_inputs.py --staging "$RUNNER_TEMP/tv-time/Image0-with-sfo/Image0" --gp4 "$RUNNER_TEMP/tv-time/package-input/tv-time-ci-fixture.gp4" --output "$RUNNER_TEMP/tv-time/package-input/package-input-audit.json" --allow-ci-fixture
      - name: Create visual review sheet
        run: python tools/make_review_sheet.py --staging "$RUNNER_TEMP/tv-time/Image0" --output "$RUNNER_TEMP/tv-time/tv-time-review-sheet.png"
      - name: Create illustrative home-screen UI overlay
        run: python tools/preview_home_ui.py --wallpaper "$RUNNER_TEMP/tv-time/Image0/texture/background/homescreen.png" --output "$RUNNER_TEMP/tv-time/tv-time-home-ui-preview.png"
      - name: Upload reviewable staging assets
        uses: actions/upload-artifact@v4
        with:
          name: tv-time-staging-assets
          path: |
            ${{ runner.temp }}/tv-time/Image0/
            ${{ runner.temp }}/tv-time/Image0-with-sfo/
            ${{ runner.temp }}/tv-time/package-input/tv-time-ci-fixture.gp4
            ${{ runner.temp }}/tv-time/package-input/package-input-audit.json
            ${{ runner.temp }}/tv-time-dynamic/
            ${{ runner.temp }}/tv-time/sound/bgm_home.wav
            ${{ runner.temp }}/tv-time/sound/bgm_home-analysis.json
            ${{ runner.temp }}/tv-time/package-input/param-ci-fixture.sfx
            ${{ runner.temp }}/tv-time/package-input/param-ci-fixture.sfo
            ${{ runner.temp }}/tv-time/tv-time-review-sheet.png
            ${{ runner.temp }}/tv-time/tv-time-home-ui-preview.png
          if-no-files-found: error
          retention-days: 7
