name: Validate TV TIME asset staging

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Cairo runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcairo2
      - name: Install asset dependencies
        run: python -m pip install -r requirements-packaging.txt
      - name: Render staging assets
        run: python tools/prepare_assets.py --output "$RUNNER_TEMP/tv-time/Image0"
      - name: Check optional AT9 conversion helper syntax
        run: python -m py_compile tools/convert_home_bgm.py
      - name: Generate original TV TIME home music
        run: python tools/generate_home_bgm.py --output "$RUNNER_TEMP/tv-time/sound/bgm_home.wav"
      - name: Validate generated home music
        run: |
          python - "$RUNNER_TEMP/tv-time/sound/bgm_home.wav" <<'PY'
          import wave, sys
          path = sys.argv[1]
          with wave.open(path, 'rb') as audio:
              assert audio.getnchannels() == 2, audio.getparams()
              assert audio.getsampwidth() == 2, audio.getparams()
              assert audio.getframerate() == 48000, audio.getparams()
              assert 31.9 <= audio.getnframes() / audio.getframerate() <= 32.1
              print('PASS:', audio.getparams())
          PY
      - name: Validate images and manifest
        run: python tools/validate_staging.py --staging "$RUNNER_TEMP/tv-time/Image0"
      - name: Create visual review sheet
        run: python tools/make_review_sheet.py --staging "$RUNNER_TEMP/tv-time/Image0" --output "$RUNNER_TEMP/tv-time/tv-time-review-sheet.png"
      - name: Create illustrative home-screen UI overlay
        run: python tools/preview_home_ui.py --wallpaper "$RUNNER_TEMP/tv-time/Image0/texture/background/homescreen.png" --output "$RUNNER_TEMP/tv-time/tv-time-home-ui-preview.png"
      - name: Upload reviewable staging assets
        uses: actions/upload-artifact@v4
        with:
          name: tv-time-staging-assets
          path: |
            ${{ runner.temp }}/tv-time/Image0/
            ${{ runner.temp }}/tv-time/sound/bgm_home.wav
            ${{ runner.temp }}/tv-time/tv-time-review-sheet.png
            ${{ runner.temp }}/tv-time/tv-time-home-ui-preview.png
          if-no-files-found: error
          retention-days: 7
